[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
emojis = "0.9.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
ratatui-textarea = "0.9.3"
nucleo-matcher = "0.3.1"
toml_edit = "0.25.17"
jiff = "0.2.38"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
unicode-width = "0.2.2"

slackers-gfx = { path = "crates/slackers-gfx" }
slackers-model = { path = "crates/slackers-model" }
slackers-slack = { path = "crates/slackers-slack" }
